<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Géneros e Estilos de Cinema</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FAF8F5',       /* Fundo suave da imagem */
              terracotta: '#BA5D3F',  /* Destaque "CINEMA" */
              terracottaDark: '#9F4D33',
              terracottaLight: '#FDF4F0',
              navy: '#1A2838',        /* Texto escuro / títulos */
              navyMuted: '#526173',
              cardBorder: '#EFEBE4',
              pillBorder: '#E4DFD5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            title: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    /* Suavização de scroll e seleção */
    body {
      background-color: #FAF8F5;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #FAF8F5;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #D8CEBE;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen text-brand-navy antialiased selection:bg-brand-terracottaLight selection:text-brand-terracotta">

  <header class="w-full max-w-4xl mx-auto px-4 pt-6 sm:pt-10 pb-4">
    <!-- Botão de Voltar / Página Inicial (conforme screenshot) -->
    <div class="mb-5">
      <a href="https://joaquim-capitao.github.io/cinema" class="inline-flex items-center gap-2 px-4 py-2 bg-white border border-brand-pillBorder rounded-full text-brand-navy text-sm font-medium shadow-sm hover:border-brand-terracotta transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-brand-navy" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
          <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.432z" />
        </svg>
        <span>Página Inicial</span>
      </a>
    </div>

    <!-- Título com ícone claquete idêntico ao estilo da imagem -->
    <div class="flex items-center gap-3 sm:gap-4 mb-3">
      <!-- Ícone Claquete Terracota -->
      <div class="text-brand-terracotta">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-brand-terracotta uppercase font-title">
        GÉNEROS CINEMATOGRÁFICOS
      </h1>
    </div>

    <!-- Divisor subtil correspondente à linha do design -->
    <hr class="border-t border-brand-pillBorder/70 mb-5">

    <!-- Sub-cabeçalho de secção ("Críticas" / "Géneros de Filme") -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
      <div class="inline-flex items-center bg-white px-5 py-2.5 rounded-2xl border border-brand-cardBorder shadow-sm">
        <h2 class="text-lg sm:text-xl font-bold text-brand-navy">

        </h2>
      </div>

      <!-- Seletor de Modo de Visualização para Mobile -->
      <div class="inline-flex p-1 bg-white border border-brand-cardBorder rounded-xl shadow-xs self-start sm:self-auto">
        <button id="btnViewCards" onclick="switchView('cards')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 bg-brand-terracotta text-white">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
          Cartões
        </button>
        <button id="btnViewTable" onclick="switchView('table')" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-navyMuted hover:text-brand-navy transition-all duration-150 flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
          Tabela
        </button>
      </div>
    </div>
  </header>

  <main class="w-full max-w-4xl mx-auto px-4 pb-16">
    <!-- Barra de Pesquisa Rápida -->
    <div class="relative mb-6">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-navyMuted">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input 
        type="text" 
        id="genreSearch" 
        placeholder="Pesquisar estilo ou título de filme em PT-PT..." 
        oninput="filterGenres()"
        class="w-full pl-10 pr-10 py-3 bg-white border border-brand-cardBorder rounded-2xl text-sm sm:text-base text-brand-navy placeholder-brand-navyMuted/60 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-terracotta/40 focus:border-brand-terracotta transition-all"
      >
      <button 
        id="clearSearchBtn" 
        onclick="clearSearch()" 
        class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs text-brand-navyMuted hover:text-brand-navy font-semibold">
        Limpar
      </button>
    </div>

    <!-- Indicador de Resultados -->
    <div class="flex items-center justify-between text-xs text-brand-navyMuted mb-4 px-1">
      <span id="resultsCount">A apresentar 15 estilos</span>
      <span class="text-[11px] bg-brand-terracottaLight text-brand-terracotta font-semibold px-2 py-0.5 rounded-full border border-brand-terracotta/20">PT-PT</span>
    </div>

    <div id="cardsContainer" class="flex flex-col gap-3.5">
      <!-- Os cartões são gerados via JavaScript para manter sincronização total -->
    </div>

    <div id="tableContainer" class="hidden overflow-hidden bg-white border border-brand-cardBorder rounded-2xl shadow-sm">
      <div class="overflow-x-auto custom-scroll">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-brand-cream border-b border-brand-cardBorder text-brand-navy font-title text-sm tracking-wide uppercase">
              <th scope="col" class="py-3.5 px-4 font-bold min-w-[130px]">Género</th>
              <th scope="col" class="py-3.5 px-4 font-bold min-w-[240px]">Descrição Narrativa</th>
              <th scope="col" class="py-3.5 px-4 font-bold min-w-[210px]">Exemplos (Títulos PT)</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-brand-cardBorder text-sm">
            <!-- As linhas da tabela são renderizadas via JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Mensagem de Sem Resultados -->
    <div id="noResults" class="hidden text-center py-12 px-4 bg-white border border-brand-cardBorder rounded-2xl shadow-sm mt-3">
      <p class="text-brand-terracotta font-semibold text-base mb-1">Nenhum estilo encontrado</p>
      <p class="text-xs text-brand-navyMuted">Tente procurar com outro termo ou limpe a caixa de pesquisa.</p>
    </div>
  </main>

  <script>
    const cinemaGenres = [
      {
        id: "acao",
        name: "Ação",
        icon: "⚡",
        desc: "Focado em adrenalina pura, confrontos físicos intensos, perseguições vertiginosas e sequências de combate coreografadas.",
        examples: ["Mad Max: Estrada da Fúria", "John Wick"]
      },
      {
        id: "scifi",
        name: "Ficção Científica",
        icon: "🚀",
        desc: "Explora conceitos especulativos baseados na ciência e tecnologia, viagens temporais, inteligência artificial e exploração espacial.",
        examples: ["Interstellar", "Blade Runner"]
      },
      {
        id: "drama",
        name: "Drama",
        icon: "🎭",
        desc: "Centrado no desenvolvimento emocional profundo das personagens, relações interpessoais e dilemas morais ou éticos verossímeis.",
        examples: ["À Espera de um Milagre", "O Padrinho"]
      },
      {
        id: "terror",
        name: "Terror",
        icon: "🕯️",
        desc: "Concebido para provocar pavor, sobressalto e choque psicológico, lidando com forças sobrenaturais ou ameaças mortais.",
        examples: ["Hereditário", "A Evocação"]
      },
      {
        id: "suspense",
        name: "Suspense / Thriller",
        icon: "🔍",
        desc: "Privilegia a criação de ansiedade contínua, segredos e reviravoltas (*plot twists*), mantendo o espetador na dúvida até ao fim.",
        examples: ["Em Parte Incerta", "Psico"]
      },
      {
        id: "comedia",
        name: "Comédia",
        icon: "😄",
        desc: "Procura provocar o riso através de situações insólitas, diálogos apurados, sátira social ou situações do quotidiano levadas ao extremo.",
        examples: ["Super Baldas", "O Grande Lebowski"]
      },
      {
        id: "romance",
        name: "Romance",
        icon: "❤️",
        desc: "Concentra-se nos relacionamentos afetivos, na paixão amorosa e nos obstáculos que os casais enfrentam para ficarem juntos.",
        examples: ["Antes do Amanhecer", "Love, Rosie"]
      },
      {
        id: "fantasia",
        name: "Fantasia",
        icon: "✨",
        desc: "Apresenta mundos imaginários com feitiçaria, criaturas míticas e universos regidos por regras sobrenaturais próprias.",
        examples: ["O Senhor dos Anéis", "A Viagem de Chihiro"]
      },
      {
        id: "animacao",
        name: "Animação",
        icon: "🎨",
        desc: "Expressão artística que confere movimento a ilustrações manuais, modelos de *stop-motion* ou modelos tridimensionais (CGI).",
        examples: ["Homem-Aranha: No Universo-Aranha", "O Túmulo dos Pirilampos"]
      },
      {
        id: "policial",
        name: "Policial / Noir",
        icon: "🕵️",
        desc: "Focado em investigações criminais, detectives particulares, corrupção institucional e no submundo urbano das grandes metrópoles.",
        examples: ["Se7en - Sete Pecados Mortais", "O Falcão Maltês"]
      },
      {
        id: "western",
        name: "Western (Faroeste)",
        icon: "🤠",
        desc: "Ambientado na fronteira histórica do Velho Oeste americano, abordando a expansão territorial, justiça pelas próprias mãos e foras-da-lei.",
        examples: ["Imperdoável", "O Bom, o Mau e o Vilão"]
      },
      {
        id: "musical",
        name: "Musical",
        icon: "🎵",
        desc: "Obras cinematográficas onde as canções e coreografias executadas pelo elenco impulsionam a narrativa ou ilustram sentimentos.",
        examples: ["La La Land: Melodia de Amor", "Cantar à Chuva"]
      },
      {
        id: "documentario",
        name: "Documentário",
        icon: "📹",
        desc: "Registo cinematográfico de não-ficção concebido para investigar a realidade, arquivar factos históricos ou analisar personalidades verídicas.",
        examples: ["Free Solo", "Amy"]
      },
      {
        id: "guerra",
        name: "Guerra",
        icon: "🎖️",
        desc: "Retrata conflitos bélicos, táctica militar e o profundo impacto psicológico e humano vivido por soldados e civis.",
        examples: ["O Resgate do Soldado Ryan", "Apocalypse Now"]
      },
      {
        id: "historico",
        name: "Histórico / Épico",
        icon: "🏛️",
        desc: "Reconstituições minuciosas de períodos remotos, guerras célebres ou biografias em produções com cenários monumentais.",
        examples: ["Gladiador", "Oppenheimer"]
      }
    ];

    let currentView = 'cards';

    function render() {
      const query = document.getElementById('genreSearch').value.toLowerCase().trim();
      const filtered = cinemaGenres.filter(item => {
        return item.name.toLowerCase().includes(query) ||
               item.desc.toLowerCase().includes(query) ||
               item.examples.some(ex => ex.toLowerCase().includes(query));
      });

      // Contagem e botão limpar
      const countEl = document.getElementById('resultsCount');
      const clearBtn = document.getElementById('clearSearchBtn');
      const noResults = document.getElementById('noResults');

      countEl.textContent = `A apresentar ${filtered.length} de ${cinemaGenres.length} estilos`;
      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
      } else {
        noResults.classList.add('hidden');
      }

      // Renderização do Modo Cartões (Mobile First)
      const cardsContainer = document.getElementById('cardsContainer');
      cardsContainer.innerHTML = filtered.map(item => `
        <article class="bg-white p-4 sm:p-5 rounded-2xl border border-brand-cardBorder shadow-sm transition hover:shadow-md hover:border-brand-terracotta/40">
          <div class="flex items-center justify-between gap-3 mb-2.5">
            <div class="flex items-center gap-2.5">
              <span class="text-xl p-1.5 bg-brand-cream rounded-xl border border-brand-cardBorder">${item.icon}</span>
              <h3 class="font-title font-bold text-base sm:text-lg text-brand-navy tracking-tight">${item.name}</h3>
            </div>
            <span class="text-[11px] font-semibold tracking-wider text-brand-terracotta uppercase bg-brand-terracottaLight px-2.5 py-1 rounded-full border border-brand-terracotta/20">
              Estilo
            </span>
          </div>
          <p class="text-xs sm:text-sm text-brand-navyMuted leading-relaxed mb-3.5">
            ${item.desc}
          </p>
          <div class="pt-3 border-t border-brand-cardBorder/60 flex flex-wrap items-center gap-1.5">
            <span class="text-[11px] font-medium text-brand-navyMuted mr-1">Obras de referência:</span>
            ${item.examples.map(ex => `
              <span class="inline-block bg-brand-cream border border-brand-cardBorder text-brand-navy text-[11px] sm:text-xs font-semibold px-2.5 py-0.5 rounded-full">
                ${ex}
              </span>
            `).join('')}
          </div>
        </article>
      `).join('');

      // Renderização do Modo Tabela
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = filtered.map(item => `
        <tr class="hover:bg-brand-cream/50 transition-colors">
          <td class="py-3.5 px-4 font-semibold text-brand-navy">
            <div class="flex items-center gap-2">
              <span>${item.icon}</span>
              <span>${item.name}</span>
            </div>
          </td>
          <td class="py-3.5 px-4 text-brand-navyMuted leading-relaxed">
            ${item.desc}
          </td>
          <td class="py-3.5 px-4">
            <div class="flex flex-col gap-1">
              ${item.examples.map(ex => `
                <span class="text-xs font-medium text-brand-terracottaDark">
                  • ${ex}
                </span>
              `).join('')}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterGenres() {
      render();
    }

    function clearSearch() {
      const input = document.getElementById('genreSearch');
      input.value = '';
      input.focus();
      render();
    }

    function switchView(view) {
      currentView = view;
      const cardsContainer = document.getElementById('cardsContainer');
      const tableContainer = document.getElementById('tableContainer');
      const btnCards = document.getElementById('btnViewCards');
      const btnTable = document.getElementById('btnViewTable');

      if (view === 'cards') {
        cardsContainer.classList.remove('hidden');
        tableContainer.classList.add('hidden');
        
        btnCards.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 bg-brand-terracotta text-white shadow-xs';
        btnTable.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-navyMuted hover:text-brand-navy transition-all duration-150 flex items-center gap-1.5';
      } else {
        cardsContainer.classList.add('hidden');
        tableContainer.classList.remove('hidden');

        btnTable.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 flex items-center gap-1.5 bg-brand-terracotta text-white shadow-xs';
        btnCards.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-navyMuted hover:text-brand-navy transition-all duration-150 flex items-center gap-1.5';
      }
    }

    // Inicialização da renderização
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
